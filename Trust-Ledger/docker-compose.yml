name: trust-ledger

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustledger
      POSTGRES_USER: trustledger
      POSTGRES_PASSWORD: trustledger
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustledger -d trustledger"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trustledger-network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: trustledger-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trustledger.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - trustledger-network
    profiles:
      - tools

networks:
  trustledger-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
